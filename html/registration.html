<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Bakers Corner</title>
    <link rel="stylesheet" href="../css/registration.css">
</head>
<body>
    <div class="reg-container">
        <div class="reg-card">
            <h2 style="text-align:center; color:#c65a2a; margin-bottom:24px;">Create Your Account</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Mobile Number:</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required placeholder="10 digit number">
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <div class="submit-row">
                    <a href="landingpage.html" class="btn-secondary" style="background:transparent; color:#c65a2a; border:1px solid #c65a2a; padding:10px 16px; border-radius:6px; text-decoration:none; cursor:pointer;">Back</a>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </div>
            </form>
            <p id="errorMessage" style="color:red; font-size:13px; margin-top:10px; text-align:center; display:none;"></p>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            // Basic validation
            if (!name || !email || !phone || !address || !username || !password || !confirmPassword) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Phone validation (10 digits)
            if (!/^\d{10}$/.test(phone)) {
                errorMessage.textContent = 'Please enter a valid 10-digit phone number';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Password length validation
            if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Password match validation
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Username length validation
            if (username.length < 3) {
                errorMessage.textContent = 'Username must be at least 3 characters';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Simulate successful registration and redirect to home
            errorMessage.style.display = 'none';
            alert('Registration successful! Welcome to Bakers Corner!');
            window.location.href = 'home.html';
        });
    </script>
</body>
</html>
