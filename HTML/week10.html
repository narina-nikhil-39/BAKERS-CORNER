<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakers Corner - POST Order</title>
    <link rel="stylesheet" href="../CSS/code.css">
</head>
<body>
    <header class="brand-header">
        <img class="brand-logo" src="../logo.png" alt="Since 1996 — Bakers Corner, Bakers & Confectioners">
        <nav class="brand-nav" aria-label="Main navigation">
            <a href="landingpage.html">HOME</a>
            <a href="catalogue.html">OUR PRODUCTS</a>
            <a href="login.html">LOGIN</a>
            <a href="registration.html">SIGN UP</a>
        </nav>
    </header>
    <main class="lab-page">
        <section class="form-panel">
        <h1>Place Your Order</h1>
        <form id="order-form" class="lab-form">
            <label for="product">Product</label>
            <select id="product" name="product" required>
                <option>Chocolate Cake</option>
                <option>Black Forest Cake</option>
                <option>Donuts</option>
                <option>Cookies</option>
            </select>
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" min="1" value="2" required>
            <button type="submit">Place Order</button>
        </form>
        </section>
        <p id="order-status" class="status output-panel" role="status" aria-live="polite"></p>
    </main>
    <script>
        const orderForm = document.getElementById("order-form");
        const orderStatus = document.getElementById("order-status");

        orderForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!orderForm.reportValidity()) {
                return;
            }

            const order = {
                product: document.getElementById("product").value.trim(),
                quantity: Number(document.getElementById("quantity").value)
            };
            orderStatus.textContent = "Sending order...";
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(order)
                });
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status}).`);
                }
                const result = await response.json();
                orderStatus.textContent = `Order sent successfully! Demo response ID: ${result.id}`;
            } catch (error) {
                orderStatus.textContent = `Order could not be sent: ${error.message}`;
            }
        });
    </script>
</body>
</html>
